[env:esp32doit-devkit-v1]
monitor_speed = 115200

platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_filters = esp32_exception_decoder
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261116
    platformio/framework-arduinoespressif32-esp32-libs@3.3.12
    platformio/tool-esptool@2.50400.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121

board_build.partitions = min_spiffs.csv

lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
    Sensirion/Sensirion I2C SGP40@0.1.0
    Sensirion/Sensirion I2C SCD4x@1.1.0
    Sensirion/Sensirion Gas Index Algorithm@3.2.3
    avaldebe/PMserial@1.2.0
    adafruit/Adafruit SSD1306@2.5.17

