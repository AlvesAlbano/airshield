[env:esp32doit-devkit-v1]
monitor_speed = 115200

platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino

platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5

board_build.partitions = min_spiffs.csv

lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
    Sensirion/Sensirion I2C SGP40@0.1.0
    Sensirion/Sensirion I2C SCD4x@1.1.0
    Sensirion/Sensirion Gas Index Algorithm@3.2.3
    avaldebe/PMserial@1.2.0
    adafruit/Adafruit SSD1306@2.5.17
    tzapu/WiFiManager@2.0.17
